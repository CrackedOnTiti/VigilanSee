[package]
name = "vigilansee"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["vigilansee-parser"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio = { version = "1.50.0", features = ["full"] }


[workspace.dependencies]
dotenvy = "0.15"