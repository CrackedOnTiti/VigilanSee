name: Set Issue Start Date

on:
  pull_request:
    types: [opened]
  push:
    branches-ignore:
      - main
      - master

jobs:
  set-start-date:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Extract issue numbers and set start date
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.VIGILANSEE_PAT }}
          script: |
            const PROJECT_ID = "PVT_kwHOCL7AO84BQCtC"
            const START_DATE_FIELD_ID = "PVTF_lAHOCL7AO84BQCtCzg-Rs7s"

            // Extract text to parse (PR body or commit message)
            let text = "";
            if (context.eventName === "pull_request") {
              text = context.payload.pull_request.body || "";
              text += " " + context.payload.pull_request.title || "";
            } else if (context.eventName === "push") {
              const commits = context.payload.commits || [];
              text = commits.map(c => c.message).join(" ");
            }

            // Find all #123 references
            const matches = [...text.matchAll(/#(\d+)/g)];
            if (!matches.length) {
              console.log("No issue references found, skipping.");
              return;
            }

            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1])))];
            console.log("Found issue references:", issueNumbers);

            const today = new Date().toISOString().split("T")[0]; // YYYY-MM-DD

            for (const issueNumber of issueNumbers) {
              // Get the issue's node ID
              let issueNodeId;
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issueNodeId = issue.data.node_id;
                console.log(`Issue #${issueNumber} node ID: ${issueNodeId}`);
              } catch (e) {
                console.log(`Issue #${issueNumber} not found, skipping.`);
                continue;
              }

              // Find the project item for this issue
              const itemQuery = await github.graphql(`
                query {
                  node(id: "${PROJECT_ID}") {
                    ... on ProjectV2 {
                      items(first: 100) {
                        nodes {
                          id
                          content {
                            ... on Issue {
                              id
                              number
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `);

              const items = itemQuery.node.items.nodes;
              const projectItem = items.find(
                item => item.content?.number === issueNumber
              );

              if (!projectItem) {
                console.log(`Issue #${issueNumber} not found in project, skipping.`);
                continue;
              }

              // Set the start date field
              await github.graphql(`
                mutation {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: "${PROJECT_ID}"
                    itemId: "${projectItem.id}"
                    fieldId: "${START_DATE_FIELD_ID}"
                    value: { date: "${today}" }
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `);

              console.log(`Set start date ${today} on issue #${issueNumber}`);
            }
